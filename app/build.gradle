plugins { id 'com.android.application' }

android {
    namespace 'com.locintel.mpesabridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.locintel.mpesabridge'
        minSdk 26
        targetSdk 35
        versionCode 151
        versionName '1.5.1'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            def ksPassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def ksAlias = System.getenv('ANDROID_KEY_ALIAS')
            def ksKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

            if (ksPath && ksPassword && ksAlias && ksKeyPassword) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
